name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # 不读真实 .env。纯逻辑测试不得依赖密钥。
      DB_PASSWORD: ci-not-used
      REDIS_PASSWORD: ci-not-used
      # 不解析 [tool.uv.sources] 的本地 ultralytics1
      UV_NO_SOURCES: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      # GitHub runner 在海外，不用 pyproject 里的清华源
      # --no-sources：不解析 [tool.uv.sources] 里的本地 ultralytics1 路径
      - run: uv sync --dev --no-sources --default-index https://pypi.org/simple
      - run: uv run --no-sources ruff check app/utils/stream_parser.py tests/test_stream_parser.py tests/test_rag_eval.py evals/run_rag_eval.py
      - run: uv run --no-sources pytest -m "not needs_model and not needs_db" -q
