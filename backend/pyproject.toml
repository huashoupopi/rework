[project]
  name = "windslice-backend"
  version = "0.1.0"
  requires-python = ">=3.12, <3.13"
  dependencies = [
      "fastapi[standard]>=0.115",
      "sqlalchemy[asyncio]>=2.0",
      "asyncpg>=0.30",
      "alembic>=1.14",
      "pydantic-settings>=2.7",
      "pyjwt>=2.10",
      "pwdlib[argon2]>=0.2",
      "python-multipart>=0.0.18",
      "dill>=0.4.1",
      "modelscope>=1.34.0",
      "llama-index-core>=0.14.15",
      "llama-index-vector-stores-postgres>=0.7.3",
      "llama-index-embeddings-huggingface>=0.6.1",
      "llama-index-llms-ollama>=0.9.1",
      "llama-index-postprocessor-flag-embedding-reranker>=0.4.1",
      "torch>=2.10.0",
      "pgvector>=0.4.2",
      "llama-index-readers-docling>=0.4.2",
      "docling>=2.77.0",
      "httpx>=0.28.1",
      "llama-index-llms-openai-like>=0.6.0",
      "flagembedding>=1.2.11",
      "pyarrow<18.0.0",
      "peft>=0.18.1",
      "redis>=5.3.1",
      "arq>=0.27.0",
      "jieba>=0.42.1",
]

[project.optional-dependencies]
yolo = [
    "ultralytics",
]

  [dependency-groups]
  dev = [
      "ruff>=0.9",
      "pytest>=8.0",
      "pytest-asyncio>=0.25",
      "httpx>=0.28",
  ]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
[tool.ruff]
  target-version = "py312"
  line-length = 99

  [tool.ruff.lint]
  select = [
      "E",     # pycodestyle errors
      "W",     # pycodestyle warnings
      "F",     # pyflakes
      "I",     # isort
      "B",     # flake8-bugbear
      "UP",    # pyupgrade
      "SIM",   # flake8-simplify
      "TCH",   # flake8-type-checking
  ]
  ignore = ["E501", "UP035"]


  [tool.ruff.lint.isort]
  known-first-party = ["app"]
  [tool.ruff.lint.flake8-bugbear]
  extend-immutable-calls = ["fastapi.Depends"]
  [tool.ruff.lint.per-file-ignores]
  "app/routers/*.py" = ["B008"]
  "app/routers/**/*.py" = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
  "needs_model: 需要加载 embedding/LLM，CI 跳过",
  "needs_db: 需要数据库或完整 app 启动，CI 跳过",
]


[tool.uv.sources]
ultralytics = { path = "../ultralytics1", editable = true }
